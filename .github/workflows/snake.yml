name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Ali-Hassan-2000
          outputs: |
            dist/github-snake.svg?color_snake=%23dc2626&color_dots=%230d0d0d,%23450a0a,%237f1d1d,%23b91c1c,%23ef4444
            dist/github-snake-dark.svg?color_snake=%23dc2626&color_dots=%230d0d0d,%23450a0a,%237f1d1d,%23b91c1c,%23ef4444

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
